<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAHA!</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .video-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .video-bg iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 56.25vw;
      min-height: 100vh;
      min-width: 177.77vh;
      transform: translate(-50%, -50%);
      border: 0;
    }
    .screen {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
      color: #00ff88;
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      text-shadow: 0 0 10px #000, 0 0 20px #000, 0 0 40px #000;
      background: rgba(0, 0, 0, 0.45);
    }
    .tap {
      color: #fff;
      text-decoration: underline;
      cursor: pointer;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="video-bg" id="video"></div>

  <!-- First screen: Tap here -->
  <div class="screen" id="tapScreen" onclick="start()">
    <div class="tap">Tap here</div>
  </div>

  <!-- Second screen: the message (hidden until tap) -->
  <div class="screen hidden" id="messageScreen">
    HAHA! There really was no Teresa cup
  </div>

  <script>
    function start() {
      // Hide "Tap here"
      document.getElementById('tapScreen').classList.add('hidden');

      // Show the message
      document.getElementById('messageScreen').classList.remove('hidden');

      // Start the rickroll with sound
      document.getElementById('video').innerHTML = `
        <iframe
          src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ?autoplay=1&loop=1&playlist=dQw4w9WgXcQ&controls=0&showinfo=0&rel=0&modestbranding=1&playsinline=1"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen
          title="Rickroll">
        </iframe>
      `;
    }
  </script>
</body>
</html>
